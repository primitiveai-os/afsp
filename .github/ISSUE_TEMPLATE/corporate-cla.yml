name: Corporate CLA
description: Sign the AFSP Corporate Contributor License Agreement on behalf of your organization.
title: "Corporate CLA: "
labels: ["corporate-cla"]
body:
  - type: markdown
    attributes:
      value: |
        Read the [Corporate CLA](https://github.com/primitiveai-os/afsp/blob/main/legal/cla/CORPORATE.md) before submitting. A maintainer will review this issue and apply the `cla-signed` label once accepted.

  - type: input
    id: organization
    attributes:
      label: Organization legal name
    validations:
      required: true

  - type: textarea
    id: address
    attributes:
      label: Organization address
    validations:
      required: true

  - type: input
    id: contact
    attributes:
      label: Point of contact (name and email)
    validations:
      required: true

  - type: textarea
    id: contributors
    attributes:
      label: Authorized contributors
      description: One per line, as "Full name, @github-username".
    validations:
      required: true

  - type: input
    id: signatory
    attributes:
      label: Signatory name and title
      description: The person accepting this agreement on behalf of the organization.
    validations:
      required: true

  - type: input
    id: date
    attributes:
      label: Date
      placeholder: YYYY-MM-DD
    validations:
      required: true

  - type: checkboxes
    id: accept
    attributes:
      label: Agreement
      options:
        - label: I am authorized to accept the AFSP Corporate CLA on behalf of the organization named above, and I accept it.
          required: true
